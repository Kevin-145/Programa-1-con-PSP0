<text x="580" y="1054" class="in2">Compromiso PSP Monitor: cumplimiento ≥ 80 % (registros completos y sincronizados)</text>
<text x="580" y="1072" class="in2">Δ = (fin − inicio) − interrupciones · Defecto = tipo + fase inyectado + fase eliminado + minutos</text>
