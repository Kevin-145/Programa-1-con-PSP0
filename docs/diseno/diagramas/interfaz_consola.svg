<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1068" viewBox="0 0 1000 1068" font-family="Segoe UI, Arial, sans-serif">
<title>Diseño de la interfaz de consola · Programa 1</title>
<style>.t{font-size:18px;font-weight:700;fill:#1d3557}.pt{font-size:13.5px;font-weight:700;fill:#1d3557}.wt{font-size:11px;fill:#aab4c0;text-anchor:middle}
.cmd,.tx,.hd,.er,.in{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12px}.cmd{fill:#7ee787}.tx{fill:#e6edf3}.hd{fill:#79c0ff}.er{fill:#ff7b72}.in{fill:#ffd866;text-decoration:underline}
.nt{font-size:15px;font-weight:700;fill:#1d3557}.nn{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}.na{font-size:13px;font-weight:700;fill:#222}.nb{font-size:12px;fill:#444}</style>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="30" y="30" class="t">Diseño de la interfaz (consola) · cuatro escenarios</text>
<text x="30" y="64" class="pt">A · Ruta como argumento (RF-07, RF-05)</text>
<rect x="30" y="72" width="660" height="232" rx="8" fill="#0f1720"/><rect x="30" y="72" width="660" height="24" rx="8" fill="#2a3441"/><rect x="30" y="88" width="660" height="8" fill="#2a3441"/>
<circle cx="48" cy="84" r="5" fill="#ff5f57"/>
<circle cx="64" cy="84" r="5" fill="#febc2e"/>
<circle cx="80" cy="84" r="5" fill="#28c840"/>
<text x="360.0" y="88" class="wt">Terminal</text>
<text x="44" y="116" class="cmd" xml:space="preserve">&gt; dotnet run --project src/Programa1.Estadistica -- datos/columna1_tamano_proxy.txt</text>
<text x="44" y="134" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="152" class="hd" xml:space="preserve"> PSP0 · Programa 1 — Media y desviación estándar</text>
<text x="44" y="170" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="188" class="tx" xml:space="preserve">Archivo leído : datos/columna1_tamano_proxy.txt</text>
<text x="44" y="206" class="tx" xml:space="preserve">Datos (n)     : 10</text>
<text x="44" y="224" class="tx" xml:space="preserve">Media         : 550.60</text>
<text x="44" y="242" class="tx" xml:space="preserve">Desv. estándar: 572.03</text>
<text x="44" y="260" class="tx" xml:space="preserve"></text>
<text x="44" y="278" class="cmd" xml:space="preserve">&gt; echo $LASTEXITCODE   → 0</text>
<text x="30" y="340" class="pt">B · Sin argumento: pide la ruta (RF-07)</text>
<rect x="30" y="348" width="660" height="214" rx="8" fill="#0f1720"/><rect x="30" y="348" width="660" height="24" rx="8" fill="#2a3441"/><rect x="30" y="364" width="660" height="8" fill="#2a3441"/>
<circle cx="48" cy="360" r="5" fill="#ff5f57"/>
<circle cx="64" cy="360" r="5" fill="#febc2e"/>
<circle cx="80" cy="360" r="5" fill="#28c840"/>
<text x="360.0" y="364" class="wt">Terminal</text>
<text x="44" y="392" class="cmd" xml:space="preserve">&gt; dotnet run --project src/Programa1.Estadistica</text>
<text x="44" y="410" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="428" class="hd" xml:space="preserve"> PSP0 · Programa 1 — Media y desviación estándar</text>
<text x="44" y="446" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="464" class="tx" xml:space="preserve">Ruta del archivo de datos (un número por línea): <tspan class="in">datos/columna2_horas.txt</tspan></text>
<text x="44" y="482" class="tx" xml:space="preserve">Archivo leído : datos/columna2_horas.txt</text>
<text x="44" y="500" class="tx" xml:space="preserve">Datos (n)     : 10</text>
<text x="44" y="518" class="tx" xml:space="preserve">Media         : 60.32</text>
<text x="44" y="536" class="tx" xml:space="preserve">Desv. estándar: 62.26</text>
<text x="30" y="598" class="pt">C · Dato inválido: indica la línea (RF-06, RNF-05)</text>
<rect x="30" y="606" width="660" height="178" rx="8" fill="#0f1720"/><rect x="30" y="606" width="660" height="24" rx="8" fill="#2a3441"/><rect x="30" y="622" width="660" height="8" fill="#2a3441"/>
<circle cx="48" cy="618" r="5" fill="#ff5f57"/>
<circle cx="64" cy="618" r="5" fill="#febc2e"/>
<circle cx="80" cy="618" r="5" fill="#28c840"/>
<text x="360.0" y="622" class="wt">Terminal</text>
<text x="44" y="650" class="cmd" xml:space="preserve">&gt; dotnet run --project src/Programa1.Estadistica -- datos/malo.txt</text>
<text x="44" y="668" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="686" class="hd" xml:space="preserve"> PSP0 · Programa 1 — Media y desviación estándar</text>
<text x="44" y="704" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="722" class="er" xml:space="preserve">ERROR: Línea 3: «abc» no es un número real. Use punto decimal (ej. 15.0).</text>
<text x="44" y="740" class="tx" xml:space="preserve"></text>
<text x="44" y="758" class="cmd" xml:space="preserve">&gt; echo $LASTEXITCODE   → 1</text>
<text x="30" y="820" class="pt">D · Un solo dato: desviación no definida (RF-04, RF-06)</text>
<rect x="30" y="828" width="660" height="196" rx="8" fill="#0f1720"/><rect x="30" y="828" width="660" height="24" rx="8" fill="#2a3441"/><rect x="30" y="844" width="660" height="8" fill="#2a3441"/>
<circle cx="48" cy="840" r="5" fill="#ff5f57"/>
<circle cx="64" cy="840" r="5" fill="#febc2e"/>
<circle cx="80" cy="840" r="5" fill="#28c840"/>
<text x="360.0" y="844" class="wt">Terminal</text>
<text x="44" y="872" class="cmd" xml:space="preserve">&gt; dotnet run --project src/Programa1.Estadistica -- datos/uno.txt</text>
<text x="44" y="890" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="908" class="hd" xml:space="preserve"> PSP0 · Programa 1 — Media y desviación estándar</text>
<text x="44" y="926" class="hd" xml:space="preserve">==================================================</text>
<text x="44" y="944" class="tx" xml:space="preserve">Archivo leído : datos/uno.txt</text>
<text x="44" y="962" class="tx" xml:space="preserve">Datos (n)     : 1</text>
<text x="44" y="980" class="tx" xml:space="preserve">Media         : 42.50</text>
<text x="44" y="998" class="tx" xml:space="preserve">Desv. estándar: no definida (se necesitan al menos 2 datos)</text>
<rect x="720" y="72" width="250" height="510" rx="8" fill="#fff" stroke="#c9d3df"/><text x="734" y="98" class="nt">Reglas de la interfaz</text>
<circle cx="742" cy="124" r="9" fill="#2f5d8a"/><text x="742" y="128" class="nn">1</text><text x="758" y="128" class="na">Encabezado</text>
<text x="758" y="146" class="nb">3 líneas fijas: identifica el </text>
<text x="758" y="162" class="nb">programa. </text>
<circle cx="742" cy="204" r="9" fill="#2f5d8a"/><text x="742" y="208" class="nn">2</text><text x="758" y="208" class="na">Etiquetas a 14 car.</text>
<text x="758" y="226" class="nb">las etiquetas de 14 caracteres </text>
<text x="758" y="242" class="nb">dejan los números en columna. </text>
<circle cx="742" cy="284" r="9" fill="#2f5d8a"/><text x="742" y="288" class="nn">3</text><text x="758" y="288" class="na">2 decimales, punto</text>
<text x="758" y="306" class="nb">F2 + InvariantCulture (RF-05, </text>
<text x="758" y="322" class="nb">RNF-02). </text>
<circle cx="742" cy="364" r="9" fill="#2f5d8a"/><text x="742" y="368" class="nn">4</text><text x="758" y="368" class="na">Entrada del usuario</text>
<text x="758" y="386" class="nb">resaltada en amarillo en el </text>
<text x="758" y="402" class="nb">modelo B. </text>
<circle cx="742" cy="444" r="9" fill="#2f5d8a"/><text x="742" y="448" class="nn">5</text><text x="758" y="448" class="na">Errores</text>
<text x="758" y="466" class="nb">1 línea, empieza por ERROR:, </text>
<text x="758" y="482" class="nb">dice causa y acción; código de </text>
<text x="758" y="498" class="nb">salida 1. </text>
<circle cx="742" cy="524" r="9" fill="#2f5d8a"/><text x="742" y="528" class="nn">6</text><text x="758" y="528" class="na">Sin «NaN» ni trazas</text>
<text x="758" y="546" class="nb">nunca se muestra una excepción </text>
<text x="758" y="562" class="nb">técnica. </text>
</svg>