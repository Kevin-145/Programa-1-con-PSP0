<path d="M470,384 V406" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M188,345 L128,370" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)"/><text x="128" y="330" class="n">lee</text>
<!-- side notes -->
<g transform="translate(775,60)"><rect width="185" height="300" rx="8" fill="#fff" stroke="#bbb"/><text x="12" y="24" class="h" style="fill:#1d3557">Reglas</text>
<text x="12" y="52" class="s">• Las flechas apuntan</text><text x="12" y="70" class="s">  hacia el dominio.</text>
<text x="12" y="98" class="s">• El dominio no depende</text><text x="12" y="116" class="s">  de ninguna otra capa:</text><text x="12" y="134" class="s">  se prueba sin archivos.</text>
<text x="12" y="162" class="s">• La consola se inyecta</text><text x="12" y="180" class="s">  (TextReader/Writer):</text><text x="12" y="198" class="s">  se prueba con StringWriter.</text>
<text x="12" y="226" class="s">• Sin base de datos:</text><text x="12" y="244" class="s">  el enunciado no la pide.</text>
<text x="12" y="272" class="n">— dependencia directa</text><text x="12" y="290" class="n">- - usa el dominio</text></g>
<text x="775" y="400" class="n">Program.cs →</text><text x="775" y="418" class="n">Aplicacion.Ejecutar(args,</text><text x="775" y="436" class="n">Console.In, Console.Out)</text>
</svg>
