<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
<title>Arquitectura en capas · Programa 1</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
<style>.t{font-size:18px;font-weight:700;fill:#1d3557}.h{font-size:15px;font-weight:700;fill:#fff}.s{font-size:12.5px;fill:#222}.m{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#222}.n{font-size:12px;fill:#555;font-style:italic}</style></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="30" y="34" class="t">Arquitectura en capas · PSP0 Programa 1</text>
<!-- actor -->
<g transform="translate(60,90)"><circle cx="20" cy="12" r="11" fill="none" stroke="#333" stroke-width="1.6"/><path d="M20,23 V55 M2,35 H38 M20,55 L6,80 M20,55 L34,80" stroke="#333" stroke-width="1.6" fill="none"/><text x="20" y="100" text-anchor="middle" class="s">Usuario</text></g>
<g transform="translate(40,330)"><path d="M0,0 h70 l14,14 v76 h-84 z" fill="#fff" stroke="#555" stroke-width="1.4"/><path d="M70,0 v14 h14" fill="none" stroke="#555"/><text x="42" y="44" text-anchor="middle" class="m">datos/</text><text x="42" y="62" text-anchor="middle" class="m">*.txt</text><text x="42" y="112" text-anchor="middle" class="s">Archivo</text></g>
<!-- layers -->
<g><rect x="190" y="60" width="560" height="96" rx="8" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.6"/><rect x="190" y="60" width="560" height="28" rx="8" fill="#2f5d8a"/><text x="205" y="80" class="h">Presentación · Presentacion/</text>
<text x="205" y="112" class="m">ConsolaUI</text><text x="205" y="134" class="s">Pide la ruta, muestra n, media y desviación (F2) o «ERROR: …»</text></g>
<g><rect x="190" y="180" width="560" height="84" rx="8" fill="#fbf1e2" stroke="#b26a00" stroke-width="1.6"/><rect x="190" y="180" width="560" height="28" rx="8" fill="#b26a00"/><text x="205" y="200" class="h">Aplicación · Aplicacion.cs</text>
<text x="205" y="232" class="m">Aplicacion.Ejecutar(args, entrada, salida) → 0 | 1</text><text x="205" y="252" class="s">Orquesta el flujo y convierte las excepciones en código de salida</text></g>
<g><rect x="190" y="288" width="560" height="96" rx="8" fill="#f2ebf7" stroke="#7a4f9a" stroke-width="1.6"/><rect x="190" y="288" width="560" height="28" rx="8" fill="#7a4f9a"/><text x="205" y="308" class="h">Infraestructura · Infraestructura/</text>
<text x="205" y="340" class="m">LectorArchivoNumeros · DatosInvalidosException</text><text x="205" y="362" class="s">Lee el archivo y convierte texto → double con CultureInfo.InvariantCulture</text></g>
<g><rect x="190" y="408" width="560" height="110" rx="8" fill="#e6f4ec" stroke="#2e7d4f" stroke-width="1.6"/><rect x="190" y="408" width="560" height="28" rx="8" fill="#2e7d4f"/><text x="205" y="428" class="h">Dominio · Dominio/  (sin consola ni archivos)</text>
<text x="205" y="460" class="m">ListaEnlazada · Nodo · CalculadoraEstadistica</text><text x="205" y="480" class="m">ResultadoEstadistico · DatosInsuficientesException</text><text x="205" y="502" class="s">Lista enlazada propia y fórmulas: x̄ = Σx/n ; σ = √(Σ(x−x̄)²/(n−1))</text></g>
<!-- arrows -->
